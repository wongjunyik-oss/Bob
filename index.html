<!DOCTYPE html>
<html>
<head>
    <title>Ragdoll Brawl</title>
    <!-- 1. The Physics Engine (Must be at the top) -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        #ui { padding: 10px; display: flex; gap: 50px; }
        .hp { font-size: 20px; font-weight: bold; }
        canvas { border: 4px solid #444; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div id="ui">
        <div id="p-hp" class="hp" style="color: #55f;">PLAYER: 100</div>
        <div id="a-hp" class="hp" style="color: #f55;">AI: 100</div>
    </div>

    <script>
        const { Engine, Render, Runner, Bodies, Composite, Constraint } = Matter;

        // --- 2. ENGINE SETUP ---
        const engine = Engine.create();
        const render = Render.create({
            element: document.body,
            engine: engine,
            options: {
                width: 800,
                height: 500,
                wireframes: false, // OFF so we see colors!
                background: '#222'
            }
        });

        // --- 3. CREATING THE WORLD ---
        // The Floor (Static = won't fall)
        const ground = Bodies.rectangle(400, 480, 810, 60, { 
            isStatic: true, 
            render: { fillStyle: '#444' } 
        });

        // Function to build a "Stick Figure"
        function createFighter(x, y, color) {
            const torso = Bodies.rectangle(x, y, 20, 50, { render: { fillStyle: color } });
            const head = Bodies.circle(x, y - 40, 15, { render: { fillStyle: color } });
            
            const neck = Constraint.create({
                bodyA: torso, bodyB: head,
                pointA: { x: 0, y: -25 }, pointB: { x: 0, y: 15 },
                stiffness: 0.2, length: 5
            });

            Composite.add(engine.world, [torso, head, neck]);
            return { torso, head };
        }

        const player = createFighter(200, 300, '#55f');
        const ai = createFighter(600, 300, '#f55');

        Composite.add(engine.world, [ground]);

        // --- 4. START EVERYTHING ---
        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        // --- 5. CONTROLS ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'a') Matter.Body.applyForce(player.torso, player.torso.position, {x: -0.01, y: 0});
            if (e.key === 'd') Matter.Body.applyForce(player.torso, player.torso.position, {x: 0.01, y: 0});
            if (e.key === 'w') Matter.Body.applyForce(player.torso, player.torso.position, {x: 0, y: -0.04});
        });
    </script>
</body>
</html>
