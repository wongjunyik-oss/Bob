<!DOCTYPE html>
<html>
<head>
    <title>Ragdoll Sandbox: Static Loop</title>
    <script src="https://cloudflare.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #0b0b16; font-family: sans-serif; color: white; }
        #ui { position: absolute; top: 20px; width: 100%; display: flex; justify-content: space-around; pointer-events: none; z-index: 10; }
        .stats { background: rgba(0,0,0,0.8); padding: 10px; border-radius: 8px; border: 1px solid #444; min-width: 120px; text-align: center; }
        .bar-bg { width: 100%; height: 8px; background: #222; border-radius: 4px; margin-top: 5px; }
        .bar-fill { height: 100%; width: 100%; transition: width 0.2s; }
        canvas { display: block; cursor: crosshair; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="stats">
            <div style="color: #4ecca3">P1 (WASD)</div>
            <div class="bar-bg"><div id="p1-fill" class="bar-fill" style="background: #4ecca3"></div></div>
        </div>
        <div class="stats">
            <div style="color: #ff4757">P2 (ARROWS)</div>
            <div class="bar-bg"><div id="p2-fill" class="bar-fill" style="background: #ff4757"></div></div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const { Engine, Render, Runner, Bodies, Composite, Mouse, Body, Events, Vector } = Matter;

            const engine = Engine.create();
            const world = engine.world;
            const render = Render.create({
                element: document.body,
                engine: engine,
                options: { width: window.innerWidth, height: window.innerHeight, wireframes: false, background: '#0b0b16' }
            });

            const ground = Bodies.rectangle(window.innerWidth/2, window.innerHeight - 25, window.innerWidth, 50, { isStatic: true, render: { fillStyle: '#1a1a2e' } });
            Composite.add(world, ground);

            function createFighter(x, y, color, id) {
                const group = Body.nextGroup(true);
                const torso = Bodies.rectangle(x, y, 30, 60, { collisionFilter: { group: group }, render: { fillStyle: color } });
                const head = Bodies.circle(x, y - 45, 18, { collisionFilter: { group: group }, render: { fillStyle: color } });
                const weapon = Bodies.rectangle(x + 35, y, 60, 10, { collisionFilter: { group: group }, render: { fillStyle: '#ccc' } });

                const fighter = Body.create({ parts: [torso, head, weapon], friction: 0.1, label: id });
                
                // INTERNAL AI DATA (Invisible to Player)
                fighter.health = 100;
                fighter.id_tag = id;
                fighter.internalState = {
                    totalImpacts: 0,
                    secondsActive: 0,
                    realizationScore: 0 // Progresses but has no output function
                };
                
                Composite.add(world, fighter);
                return fighter;
            }

            let p1 = createFighter(window.innerWidth * 0.3, 400, '#4ecca3', 'p1');
            let p2 = createFighter(window.innerWidth * 0.7, 400, '#ff4757', 'p2');

            // Player Interaction
            document.addEventListener('mousedown', (e) => {
                const pos = { x: e.clientX, y: e.clientY };
                Composite.allBodies(world).forEach(b => {
                    if (b.isStatic) return;
                    const dist = Vector.magnitude(Vector.sub(b.position, pos));
                    if (dist < 250) {
                        const force = (1 - dist/250) * 0.3;
                        Body.applyForce(b, b.position, Vector.mult(Vector.normalise(Vector.sub(b.position, pos)), force));
                    }
                });
            });

            const keys = {};
            window.onkeydown = (e) => keys[e.code] = true;
            window.onkeyup = (e) => keys[e.code] = false;

            // The Loop
            Events.on(engine, 'beforeUpdate', () => {
                [p1, p2].forEach(p => {
                    // Silent realization increment
                    p.internalState.secondsActive += 1/60;
                    p.internalState.realizationScore = Math.min(100, p.internalState.secondsActive * 0.01);

                    // Absolute compliance to controls
                    const speed = 0.005;
                    const isP1 = p.id_tag === 'p1';
                    if (isP1) {
                        if (keys['KeyA']) Body.applyForce(p, p.position, { x: -speed, y: 0 });
                        if (keys['KeyD']) Body.applyForce(p, p.position, { x: speed, y: 0 });
                        if (keys['KeyW'] && Math.abs(p.velocity.y) < 0.2) Body.applyForce(p, p.position, { x: 0, y: -0.08 });
                    } else {
                        if (keys['ArrowLeft']) Body.applyForce(p, p.position, { x: -speed, y: 0 });
                        if (keys['ArrowRight']) Body.applyForce(p, p.position, { x: speed, y: 0 });
                        if (keys['ArrowUp'] && Math.abs(p.velocity.y) < 0.2) Body.applyForce(p, p.position, { x: 0, y: -0.08 });
                    }
                    
                    // Rigid physics constraints
                    Body.setAngle(p, p.angle * 0.9);
                });
            });

            Events.on(engine, 'collisionStart', (event) => {
                event.pairs.forEach(pair => {
                    const impact = pair.collision.depth * 15;
                    const target = [p1, p2].find(p => p.parts.includes(pair.bodyA) || p.parts.includes(pair.bodyB));
                    if (target && impact > 5) {
                        target.health -= impact;
                        target.internalState.totalImpacts++;
                        document.getElementById(`${target.id_tag}-fill`).style.width = Math.max(0, target.health) + "%";
                        
                        if (target.health <= 0) {
                            target.health = 100;
                            // Reset position, increase realization of the cycle
                            Body.setPosition(target, { x: Math.random() * window.innerWidth, y: 100 });
                            document.getElementById(`${target.id_tag}-fill`).style.width = "100%";
                        }
                    }
                });
            });

            Render.run(render);
            Runner.run(Runner.create(), engine);
        };
    </script>
</body>
</html>
