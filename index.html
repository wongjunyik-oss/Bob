<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sandbox: Random Weapons</title>
    <script src="https://cloudflare.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #0f0f1b; font-family: sans-serif; color: white; }
        #ui { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 10px; pointer-events: none; border: 1px solid #333; }
        kbd { background: #333; padding: 2px 6px; border-radius: 4px; border: 1px solid #666; font-family: monospace; }
    </style>
</head>
<body>

    <div id="ui">
        <h2 style="margin:0 0 10px 0; color: #4ecca3;">Physics Armory</h2>
        <p><kbd>W</kbd><kbd>A</kbd><kbd>D</kbd> - Move</p>
        <p><kbd>F</kbd> - Shockwave</p>
        <p><kbd>R</kbd> - New Weapons (Reset)</p>
        <p><i>Drag the characters to see the physics!</i></p>
    </div>

    <script>
        const { Engine, Render, Runner, Bodies, Composite, Constraint, Mouse, MouseConstraint, Body } = Matter;

        const engine = Engine.create();
        const world = engine.world;

        const render = Render.create({
            element: document.body,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false,
                background: '#0f0f1b'
            }
        });

        // 1. Random Weapon Generator
        function createRandomWeapon(x, y, group) {
            const types = ['sword', 'hammer', 'shield'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            let weaponBody;
            if (type === 'sword') {
                weaponBody = Bodies.rectangle(x + 40, y, 80, 10, { 
                    collisionFilter: { group: group },
                    render: { fillStyle: '#bdc3c7' },
                    label: 'sword'
                });
            } else if (type === 'hammer') {
                const handle = Bodies.rectangle(x + 30, y, 60, 8, { collisionFilter: { group: group } });
                const head = Bodies.rectangle(x + 60, y, 30, 40, { collisionFilter: { group: group } });
                weaponBody = Body.create({ 
                    parts: [handle, head], 
                    render: { fillStyle: '#7f8c8d' } 
                });
            } else {
                weaponBody = Bodies.rectangle(x + 30, y, 15, 80, { 
                    collisionFilter: { group: group },
                    render: { fillStyle: '#2980b9' } 
                });
            }
            return weaponBody;
        }

        // 2. Fighter with Compound Weapon
        function createFighter(x, y, color) {
            const group = Body.nextGroup(true);
            const torso = Bodies.rectangle(x, y, 30, 60, { collisionFilter: { group: group }, render: { fillStyle: color } });
            const head = Bodies.circle(x, y - 45, 18, { collisionFilter: { group: group }, render: { fillStyle: color } });
            
            // Generate and "Weld" weapon to torso
            const weapon = createRandomWeapon(x, y, group);
            const compoundFighter = Body.create({
                parts: [torso, head, weapon],
                friction: 0.5
            });

            Composite.add(world, compoundFighter);
            return compoundFighter;
        }

        // 3. Environment
        const floor = Bodies.rectangle(window.innerWidth/2, window.innerHeight-20, window.innerWidth, 40, { isStatic: true, render: { fillStyle: '#222' } });
        createFighter(200, 300, '#4ecca3');
        createFighter(600, 300, '#e94560');

        Composite.add(world, floor);

        // 4. Interactive Controls
        const mouse = Mouse.create(render.canvas);
        const mouseConstraint = MouseConstraint.create(engine, {
            mouse: mouse,
            constraint: { stiffness: 0.2, render: { visible: false } }
        });
        Composite.add(world, mouseConstraint);

        window.addEventListener('keydown', (e) => {
            if (e.key === 'r') location.reload();
            if (e.key === 'f') {
                Composite.allBodies(world).forEach(b => {
                    if(!b.isStatic) Body.applyForce(b, b.position, {x: (Math.random()-0.5)*0.2, y: -0.2});
                });
            }
        });

        Render.run(render);
        Runner.run(Runner.create(), engine);
    </script>
</body>
</html>
