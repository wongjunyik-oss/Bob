<!DOCTYPE html>
<html>
<head>
    <title>Ragdoll Sandbox: Chaos Edition</title>
    <!-- Matter.js Library -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #0b0b16; font-family: sans-serif; color: white; }
        #ui { position: absolute; top: 20px; width: 100%; display: flex; justify-content: space-around; pointer-events: none; z-index: 100; }
        .stats { background: rgba(0,0,0,0.8); padding: 10px; border-radius: 8px; border: 1px solid #444; min-width: 120px; text-align: center; }
        .bar-bg { width: 100%; height: 8px; background: #222; border-radius: 4px; margin-top: 5px; }
        .bar-fill { height: 100%; width: 100%; transition: width 0.2s; }
        
        #toolbar { position: absolute; left: 20px; top: 100px; display: flex; flex-direction: column; gap: 10px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; border: 1px solid #ff00ff; z-index: 100; pointer-events: auto; }
        button { background: #222; color: white; border: 1px solid #ff00ff; padding: 10px; cursor: pointer; border-radius: 4px; }
        button.active { background: #ff00ff; color: black; font-weight: bold; }
        
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="stats">
            <div style="color: #4ecca3">P1 (WASD)</div>
            <div class="bar-bg"><div id="p1-fill" class="bar-fill" style="background: #4ecca3"></div></div>
        </div>
        <div class="stats">
            <div style="color: #ff4757">P2 (ARROWS)</div>
            <div class="bar-bg"><div id="p2-fill" class="bar-fill" style="background: #ff4757"></div></div>
        </div>
    </div>

    <div id="toolbar">
        <button id="btn-boom" class="active" onclick="setTool('boom')">EXPLOSION</button>
        <button id="btn-spawn" onclick="setTool('spawn')">SPAWN BOX</button>
        <button id="btn-heal" onclick="setTool('heal')">RESPAWN ALL</button>
    </div>

    <script>
        let currentTool = 'boom';
        function setTool(t) {
            currentTool = t;
            document.querySelectorAll('#toolbar button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + t).classList.add('active');
        }

        window.onload = function() {
            const { Engine, Render, Runner, Bodies, Composite, Mouse, Body, Events, Vector } = Matter;

            const engine = Engine.create();
            const world = engine.world;

            // FIX: Append directly to body to ensure visibility
            const render = Render.create({
                element: document.body,
                engine: engine,
                options: {
                    width: window.innerWidth,
                    height: window.innerHeight,
                    wireframes: false, // CRITICAL: This makes the figures visible
                    background: '#0b0b16'
                }
            });

            // 1. Floor
            const ground = Bodies.rectangle(window.innerWidth/2, window.innerHeight - 25, window.innerWidth, 50, { 
                isStatic: true, render: { fillStyle: '#1a1a2e' } 
            });
            Composite.add(world, ground);

            // 2. Ragdoll Creator
            function createFighter(x, y, color, id) {
                const group = Body.nextGroup(true);
                const torso = Bodies.rectangle(x, y, 30, 60, { collisionFilter: { group: group }, render: { fillStyle: color } });
                const head = Bodies.circle(x, y - 45, 18, { collisionFilter: { group: group }, render: { fillStyle: color } });
                const weapon = Bodies.rectangle(x + 35, y, 60, 10, { collisionFilter: { group: group }, render: { fillStyle: '#ccc' } });

                const fighter = Body.create({ 
                    parts: [torso, head, weapon], 
                    friction: 0.1, 
                    restitution: 0.5,
                    label: id 
                });
                fighter.health = 100;
                fighter.id_tag = id;
                fighter.isDead = false;
                
                Composite.add(world, fighter);
                return fighter;
            }

            let p1 = createFighter(window.innerWidth * 0.3, 400, '#4ecca3', 'p1');
            let p2 = createFighter(window.innerWidth * 0.7, 400, '#ff4757', 'p2');

            // 3. Mouse Tools
            document.addEventListener('mousedown', (e) => {
                const pos = { x: e.clientX, y: e.clientY };
                if (currentTool === 'boom') {
                    Composite.allBodies(world).forEach(b => {
                        if (b.isStatic) return;
                        const dist = Vector.magnitude(Vector.sub(b.position, pos));
                        if (dist < 250) {
                            const force = (1 - dist/250) * 0.3;
                            Body.applyForce(b, b.position, Vector.mult(Vector.normalise(Vector.sub(b.position, pos)), force));
                        }
                    });
                } else if (currentTool === 'spawn') {
                    Composite.add(world, Bodies.rectangle(pos.x, pos.y, 40, 40, { render: { fillStyle: '#d35400' } }));
                } else if (currentTool === 'heal') {
                    [p1, p2].forEach(p => {
                        p.health = 100; p.isDead = false;
                        Body.setPosition(p, { x: p.id_tag === 'p1' ? 200 : window.innerWidth - 200, y: 100 });
                        document.getElementById(`${p.id_tag}-fill`).style.width = "100%";
                    });
                }
            });

            // 4. Keyboard Controls
            const keys = {};
            window.onkeydown = (e) => keys[e.code] = true;
            window.onkeyup = (e) => keys[e.code] = false;

            Events.on(engine, 'beforeUpdate', () => {
                const speed = 0.005;
                if (!p1.isDead) {
                    if (keys['KeyA']) Body.applyForce(p1, p1.position, { x: -speed, y: 0 });
                    if (keys['KeyD']) Body.applyForce(p1, p1.position, { x: speed, y: 0 });
                    if (keys['KeyW']) Body.applyForce(p1, p1.position, { x: 0, y: -0.05 });
                    Body.setAngle(p1, p1.angle * 0.85);
                }
                if (!p2.isDead) {
                    if (keys['ArrowLeft']) Body.applyForce(p2, p2.position, { x: -speed, y: 0 });
                    if (keys['ArrowRight']) Body.applyForce(p2, p2.position, { x: speed, y: 0 });
                    if (keys['ArrowUp']) Body.applyForce(p2, p2.position, { x: 0, y: -0.05 });
                    Body.setAngle(p2, p2.angle * 0.85);
                }
            });

            // 5. Combat
            Events.on(engine, 'collisionStart', (event) => {
                event.pairs.forEach(pair => {
                    const impact = pair.collision.depth * 8;
                    const target = [p1, p2].find(p => p.parts.includes(pair.bodyA) || p.parts.includes(pair.bodyB));
                    if (target && !target.isDead && impact > 4) {
                        target.health -= impact;
                        document.getElementById(`${target.id_tag}-fill`).style.width = Math.max(0, target.health) + "%";
                        if (target.health <= 0) target.isDead = true;
                    }
                });
            });

            Render.run(render);
            Runner.run(Runner.create(), engine);
        };
    </script>
</body>
</html>
