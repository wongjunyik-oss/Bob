<!DOCTYPE html>
<html>
<head>
    <title>Physics Brawler</title>
    <script src="https://cloudflare.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #222; color: white; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; width: 100%; display: flex; justify-content: space-around; pointer-events: none; }
        .hp { font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="p-hp" class="hp" style="color: #44f;">PLAYER: 100</div>
        <div id="a-hp" class="hp" style="color: #f44;">AI: 100</div>
    </div>
    <script>
        // --- 1. SETUP ENGINE ---
        const { Engine, Render, Runner, Bodies, Composite, Constraint, Mouse, MouseConstraint } = Matter;
        const engine = Engine.create();
        const world = engine.world;
        const render = Render.create({
            element: document.body,
            engine: engine,
            options: { width: 800, height: 600, wireframes: false, background: '#ddd' }
        });

        Render.run(render);
        Runner.run(Runner.create(), engine);

        // --- 2. GAME OBJECTS ---
        const ground = Bodies.rectangle(400, 580, 810, 60, { isStatic: true, render: { fillStyle: '#666' } });
        
        function createRagdoll(x, y, color) {
            const torso = Bodies.rectangle(x, y, 30, 60, { render: { fillStyle: color }, friction: 0.5 });
            const head = Bodies.circle(x, y - 45, 15, { render: { fillStyle: color } });
            
            const neck = Constraint.create({
                bodyA: torso, bodyB: head, 
                pointA: { x: 0, y: -30 }, pointB: { x: 0, y: 15 },
                stiffness: 0.6, length: 2
            });

            Composite.add(world, [torso, head, neck]);
            return { torso, head, health: 100 };
        }

        const player = createRagdoll(200, 400, '#44f');
        const ai = createRagdoll(600, 400, '#f44');
        Composite.add(world, [ground]);

        // --- 3. CONTROLS ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'a') Matter.Body.applyForce(player.torso, player.torso.position, {x: -0.02, y: 0});
            if (e.key === 'd') Matter.Body.applyForce(player.torso, player.torso.position, {x: 0.02, y: 0});
            if (e.key === 'w') Matter.Body.applyForce(player.torso, player.torso.position, {x: 0, y: -0.05});
        });

        // --- 4. GAME LOOP ---
        (function update() {
            // Simple AI follow logic
            const dist = player.torso.position.x - ai.torso.position.x;
            if (Math.abs(dist) > 50) {
                Matter.Body.applyForce(ai.torso, ai.torso.position, {x: dist > 0 ? 0.01 : -0.01, y: 0});
            }
            requestAnimationFrame(update);
        })();
    </script>
</body>
</html>
