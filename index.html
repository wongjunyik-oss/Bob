<!DOCTYPE html>
<html>
<head>
  <title>Mini ChatGPT (Real AI)</title>
  <style>
    body { font-family:sans-serif; background:#111; color:#fff; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
    #chat-container { width:450px; background:#222; padding:20px; border-radius:10px; }
    #messages { height:300px; overflow-y:auto; border:1px solid #555; padding:10px; margin-bottom:10px; border-radius:5px; }
    input, textarea { width:100%; padding:5px; border-radius:5px; border:none; margin-top:5px; }
    button { padding:5px 10px; border-radius:5px; border:none; background:#0af; color:#fff; cursor:pointer; margin-top:5px; }
    .user { color:#0f0; margin-bottom:5px; }
    .ai { color:#0ff; margin-bottom:5px; }
  </style>
</head>
<body>
  <div id="chat-container">
    <div id="messages"></div>
    <input type="text" id="question" placeholder="Ask me something..." />
    <button id="askBtn">Ask</button>
    <textarea id="codeInput" placeholder="Paste code here if you want edits..." rows="5"></textarea>
    <input type="text" id="editInstruction" placeholder="What do you want to change in the code?" />
    <button id="editBtn">Edit Code</button>
  </div>

  <script>
    const messages = document.getElementById('messages');
    const questionInput = document.getElementById('question');
    const askBtn = document.getElementById('askBtn');
    const codeInput = document.getElementById('codeInput');
    const editInstruction = document.getElementById('editInstruction');
    const editBtn = document.getElementById('editBtn');

    function addMessage(text, cls){
      const div = document.createElement('div');
      div.className = cls;
      div.innerText = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    async function askOpenAI(prompt){
      const apiKey = "YOUR_OPENAI_API_KEY"; // ⚠️ replace with your key
      const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization":"Bearer " + apiKey
        },
        body: JSON.stringify({
          model: "gpt-3.5-turbo",
          messages: [{role:"user", content: prompt}],
          max_tokens: 300
        })
      });
      const data = await response.json();
      return data.choices[0].message.content;
    }

    askBtn.addEventListener("click", async ()=>{
      const question = questionInput.value.trim();
      if(!question) return;
      addMessage("You: " + question, "user");
      addMessage("AI: ...", "ai");
      const answer = await askOpenAI(question);
      messages.lastChild.innerText = "AI: " + answer;
      questionInput.value = "";
    });

    questionInput.addEventListener("keypress", e=>{
      if(e.key === "Enter") askBtn.click();
    });

    editBtn.addEventListener("click", async ()=>{
      const code = codeInput.value.trim();
      const instruction = editInstruction.value.trim();
      if(!code || !instruction) return;
      addMessage("You (code edit): " + instruction, "user");
      addMessage("AI: ...", "ai");
      const prompt = `Here is my code:\n${code}\n\nPlease apply this instruction: ${instruction}`;
      const answer = await askOpenAI(prompt);
      messages.lastChild.innerText = "AI:\n" + answer;
    });
  </script>
</body>
</html>
