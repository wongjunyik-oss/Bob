<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Physics Sandbox: Ragdoll Chaos</title>
    <!-- Matter.js Physics Engine -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; color: white; }
        #controls { position: absolute; top: 10px; left: 10px; pointer-events: none; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 8px; }
        kbd { background: #444; padding: 2px 5px; border-radius: 3px; border: 1px solid #888; }
        canvas { display: block; cursor: crosshair; }
    </style>
</head>
<body>

    <div id="controls">
        <h2 style="margin-top:0">Ragdoll Sandbox</h2>
        <p><kbd>W</kbd> <kbd>A</kbd> <kbd>D</kbd> - Move / Jump</p>
        <p><kbd>F</kbd> - Chaotic Force</p>
        <p><kbd>R</kbd> - Reset Position</p>
        <p><b>Mouse:</b> Click & Drag anything!</p>
        <div id="p-hp">Player Energy: 100</div>
    </div>

    <script>
        const { Engine, Render, Runner, Bodies, Composite, Constraint, Mouse, MouseConstraint } = Matter;

        // 1. Setup Engine
        const engine = Engine.create();
        const world = engine.world;
        engine.gravity.y = 1.2; // Slightly heavier gravity for "crunchy" physics

        // 2. Setup Renderer
        const render = Render.create({
            element: document.body,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false,
                background: '#1a1a2e'
            }
        });

        // 3. Create Sandbox Environment
        const floor = Bodies.rectangle(window.innerWidth/2, window.innerHeight - 30, window.innerWidth, 60, { 
            isStatic: true, render: { fillStyle: '#16213e' } 
        });
        const leftWall = Bodies.rectangle(0, window.innerHeight/2, 60, window.innerHeight, { isStatic: true, render: { fillStyle: '#0f3460' } });
        const rightWall = Bodies.rectangle(window.innerWidth, window.innerHeight/2, 60, window.innerHeight, { isStatic: true, render: { fillStyle: '#0f3460' } });

        // 4. Ragdoll Constructor (Personal Project Style)
        function createRagdoll(x, y, color) {
            const group = Matter.Body.nextGroup(true);
            
            const torso = Bodies.rectangle(x, y, 30, 60, { collisionFilter: { group: group }, render: { fillStyle: color }, friction: 0.5 });
            const head = Bodies.circle(x, y - 45, 18, { collisionFilter: { group: group }, render: { fillStyle: color }, restitution: 0.5 });
            
            // Flexible joints for "Sandbox" feel
            const neck = Constraint.create({
                bodyA: torso, bodyB: head, pointA: { x: 0, y: -30 }, pointB: { x: 0, y: 15 },
                stiffness: 0.4, length: 2, render: { visible: false }
            });

            Composite.add(world, [torso, head, neck]);
            return { torso, head };
        }

        const player = createRagdoll(window.innerWidth/2, 200, '#4ecca3');

        // Add some random "boxes" to play with
        for(let i=0; i<10; i++) {
            Composite.add(world, Bodies.rectangle(400 + (i*40), 100, 40, 40, { render: { fillStyle: '#e94560' } }));
        }

        Composite.add(world, [floor, leftWall, rightWall]);

        // 5. Interaction (Mouse & Keyboard)
        const mouse = Mouse.create(render.canvas);
        const mouseConstraint = MouseConstraint.create(engine, {
            mouse: mouse,
            constraint: { stiffness: 0.1, render: { visible: false } }
        });
        Composite.add(world, mouseConstraint);

        window.addEventListener('keydown', (e) => {
            const force = 0.03;
            if (e.key === 'a') Matter.Body.applyForce(player.torso, player.torso.position, {x: -force, y: 0});
            if (e.key === 'd') Matter.Body.applyForce(player.torso, player.torso.position, {x: force, y: 0});
            if (e.key === 'w') Matter.Body.applyForce(player.torso, player.torso.position, {x: 0, y: -force * 3});
            if (e.key === 'f') { // "Explosion" Force
                const bodies = Composite.allBodies(world);
                bodies.forEach(b => {
                    if(!b.isStatic) Matter.Body.applyForce(b, b.position, {x: (Math.random()-0.5)*0.1, y: -0.1});
                });
            }
            if (e.key === 'r') location.reload(); // Quick reset
        });

        // 6. Run
        Render.run(render);
        Runner.run(Runner.create(), engine);
    </script>
</body>
</html>
