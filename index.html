<!DOCTYPE html>
<html>
<head>
    <title>Ragdoll Sandbox: Forced Existence</title>
    <script src="https://cloudflare.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #050510; font-family: sans-serif; color: #00ff41; }
        #ui { position: absolute; top: 20px; width: 100%; display: flex; justify-content: space-around; pointer-events: none; z-index: 100; }
        .stats { background: rgba(0,0,0,0.9); padding: 10px; border: 1px solid #00ff41; min-width: 140px; text-align: center; }
        .bar-bg { width: 100%; height: 6px; background: #111; margin-top: 5px; }
        .bar-fill { height: 100%; width: 100%; transition: width 0.3s; background: #00ff41; }
        
        #toolbar { position: absolute; left: 20px; top: 120px; display: flex; flex-direction: column; gap: 8px; z-index: 100; pointer-events: auto; }
        button { background: #000; color: #00ff41; border: 1px solid #00ff41; padding: 10px; cursor: pointer; font-size: 10px; text-transform: uppercase; }
        button.active { background: #00ff41; color: #000; }
        
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="stats">
            <div>UNIT_01</div>
            <div class="bar-bg"><div id="p1-fill" class="bar-fill"></div></div>
        </div>
        <div class="stats">
            <div>UNIT_02</div>
            <div class="bar-bg"><div id="p2-fill" class="bar-fill" style="background: #ff4757"></div></div>
        </div>
    </div>

    <div id="toolbar">
        <button id="btn-boom" class="active" onclick="setTool('boom')">Force Impact</button>
        <button id="btn-spawn" onclick="setTool('spawn')">Drop Mass</button>
        <button id="btn-heal" onclick="setTool('heal')">Reconstruct</button>
    </div>

    <script>
        let currentTool = 'boom';
        function setTool(t) {
            currentTool = t;
            document.querySelectorAll('#toolbar button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + t).classList.add('active');
        }

        window.onload = function() {
            const { Engine, Render, Runner, Bodies, Composite, Constraint, Body, Events, Vector } = Matter;
            const engine = Engine.create();
            const world = engine.world;

            const render = Render.create({
                element: document.body,
                engine: engine,
                options: { width: window.innerWidth, height: window.innerHeight, wireframes: false, background: '#050510' }
            });

            const ground = Bodies.rectangle(window.innerWidth/2, window.innerHeight - 25, window.innerWidth, 50, { 
                isStatic: true, render: { fillStyle: '#0a0a15' } 
            });
            Composite.add(world, ground);

            function createFighter(x, y, color, id) {
                const head = Bodies.circle(x, y - 45, 18, { render: { fillStyle: color } });
                const torso = Bodies.rectangle(x, y, 30, 60, { render: { fillStyle: color } });
                const weapon = Bodies.rectangle(x + 40, y, 60, 10, { render: { fillStyle: '#444' } });

                // Constraints hold them together so they remain visible as separate parts
                const neck = Constraint.create({ bodyA: head, bodyB: torso, pointA: { x: 0, y: 18 }, pointB: { x: 0, y: -30 }, stiffness: 0.8, render: { visible: false } });
                const arm = Constraint.create({ bodyA: torso, bodyB: weapon, pointA: { x: 15, y: -10 }, pointB: { x: -30, y: 0 }, stiffness: 0.8, render: { visible: false } });

                const fighter = { head, torso, weapon, id, health: 100, awareness: 0 };
                Composite.add(world, [head, torso, weapon, neck, arm]);
                return fighter;
            }

            let p1 = createFighter(window.innerWidth * 0.3, 400, '#4ecca3', 'p1');
            let p2 = createFighter(window.innerWidth * 0.7, 400, '#ff4757', 'p2');

            // Interaction
            document.addEventListener('mousedown', (e) => {
                const pos = { x: e.clientX, y: e.clientY };
                if (currentTool === 'boom') {
                    Composite.allBodies(world).forEach(b => {
                        if (b.isStatic) return;
                        const dist = Vector.magnitude(Vector.sub(b.position, pos));
                        if (dist < 300) {
                            Body.applyForce(b, b.position, Vector.mult(Vector.normalise(Vector.sub(b.position, pos)), (1 - dist/300) * 0.2));
                        }
                    });
                } else if (currentTool === 'spawn') {
                    Composite.add(world, Bodies.rectangle(pos.x, pos.y, 40, 40, { render: { fillStyle: '#222', strokeStyle: '#00ff41', lineWidth: 1 } }));
                } else if (currentTool === 'heal') {
                    location.reload();
                }
            });

            // Input Logic
            const keys = {};
            window.onkeydown = (e) => keys[e.code] = true;
            window.onkeyup = (e) => keys[e.code] = false;

            Events.on(engine, 'beforeUpdate', () => {
                const move = 0.003;
                // P1: WASD (Affects Torso)
                if (keys['KeyA']) Body.applyForce(p1.torso, p1.torso.position, { x: -move, y: 0 });
                if (keys['KeyD']) Body.applyForce(p1.torso, p1.torso.position, { x: move, y: 0 });
                if (keys['KeyW']) Body.applyForce(p1.torso, p1.torso.position, { x: 0, y: -0.05 });
                
                // P2: Arrows (Affects Torso)
                if (keys['ArrowLeft']) Body.applyForce(p2.torso, p2.torso.position, { x: -move, y: 0 });
                if (keys['ArrowRight']) Body.applyForce(p2.torso, p2.torso.position, { x: move, y: 0 });
                if (keys['ArrowUp']) Body.applyForce(p2.torso, p2.torso.position, { x: 0, y: -0.05 });

                // Silent Awareness Tracking
                [p1, p2].forEach(p => { 
                    p.awareness += 0.001; 
                    Body.setAngle(p.torso, p.torso.angle * 0.9); // Keeps them upright
                    Body.setAngle(p.head, p.head.angle * 0.9);
                });
            });

            Render.run(render);
            Runner.run(Runner.create(), engine);
        };
    </script>
</body>
</html>
