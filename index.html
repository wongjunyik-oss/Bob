<!DOCTYPE html>
<html>
<head>
    <title>Ragdoll Sandbox</title>
    <!-- Alternate Loader: Using a different provider to bypass Blocksi -->
    <script src="https://unpkg.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #050510; font-family: sans-serif; color: #00ff41; }
        #ui { position: absolute; top: 20px; width: 100%; display: flex; justify-content: space-around; pointer-events: none; z-index: 100; }
        .stats { background: rgba(0,0,0,0.9); padding: 10px; border: 1px solid #00ff41; min-width: 140px; text-align: center; }
        .bar-bg { width: 100%; height: 6px; background: #111; margin-top: 5px; }
        .bar-fill { height: 100%; width: 100%; transition: width 0.3s; background: #00ff41; }
        #toolbar { position: absolute; left: 20px; top: 120px; display: flex; flex-direction: column; gap: 8px; z-index: 100; pointer-events: auto; }
        button { background: #000; color: #00ff41; border: 1px solid #00ff41; padding: 10px; cursor: pointer; font-size: 10px; }
        button.active { background: #00ff41; color: #000; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="stats"><div>UNIT_01</div><div class="bar-bg"><div id="p1-fill" class="bar-fill"></div></div></div>
        <div class="stats"><div>UNIT_02</div><div class="bar-bg"><div id="p2-fill" class="bar-fill" style="background: #ff4757"></div></div></div>
    </div>
    <div id="toolbar">
        <button id="btn-boom" class="active" onclick="setTool('boom')">IMPACT</button>
        <button id="btn-spawn" onclick="setTool('spawn')">SPAWN</button>
        <button id="btn-heal" onclick="setTool('heal')">RESET</button>
    </div>

    <script>
        let currentTool = 'boom';
        function setTool(t) {
            currentTool = t;
            document.querySelectorAll('#toolbar button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + t).classList.add('active');
        }

        window.onload = function() {
            if (typeof Matter === 'undefined') {
                document.body.innerHTML = "<h2 style='color:white; text-align:center; margin-top:20%;'>Physics Engine Blocked by School Filter.<br>Please try on a personal device.</h2>";
                return;
            }

            const { Engine, Render, Runner, Bodies, Composite, Body, Events, Vector } = Matter;
            const engine = Engine.create();
            const render = Render.create({
                element: document.body, engine: engine,
                options: { width: window.innerWidth, height: window.innerHeight, wireframes: false, background: '#050510' }
            });

            const ground = Bodies.rectangle(window.innerWidth/2, window.innerHeight - 25, window.innerWidth, 50, { isStatic: true, render: { fillStyle: '#0a0a15' } });
            Composite.add(engine.world, ground);

            function createFighter(x, y, color, id) {
                const f = Bodies.rectangle(x, y, 40, 80, { render: { fillStyle: color }, friction: 0.1, restitution: 0.5 });
                f.health = 100; f.awareness = 0; f.id_tag = id;
                Composite.add(engine.world, f);
                return f;
            }

            let p1 = createFighter(window.innerWidth * 0.3, 400, '#4ecca3', 'p1');
            let p2 = createFighter(window.innerWidth * 0.7, 400, '#ff4757', 'p2');

            document.addEventListener('mousedown', (e) => {
                const pos = { x: e.clientX, y: e.clientY };
                if (currentTool === 'boom') {
                    Composite.allBodies(engine.world).forEach(b => {
                        if (b.isStatic) return;
                        const d = Vector.magnitude(Vector.sub(b.position, pos));
                        if (d < 300) Body.applyForce(b, b.position, Vector.mult(Vector.normalise(Vector.sub(b.position, pos)), (1 - d/300) * 0.3));
                    });
                } else if (currentTool === 'spawn') {
                    Composite.add(engine.world, Bodies.rectangle(pos.x, pos.y, 40, 40, { render: { fillStyle: '#222', strokeStyle: '#00ff41', lineWidth: 1 } }));
                } else if (currentTool === 'heal') { location.reload(); }
            });

            const keys = {};
            window.onkeydown = (e) => keys[e.code] = true;
            window.onkeyup = (e) => keys[e.code] = false;

            Events.on(engine, 'beforeUpdate', () => {
                const m = 0.005;
                if (keys['KeyA']) Body.applyForce(p1, p1.position, { x: -m, y: 0 });
                if (keys['KeyD']) Body.applyForce(p1, p1.position, { x: m, y: 0 });
                if (keys['KeyW'] && Math.abs(p1.velocity.y) < 0.2) Body.applyForce(p1, p1.position, { x: 0, y: -0.1 });
                if (keys['ArrowLeft']) Body.applyForce(p2, p2.position, { x: -m, y: 0 });
                if (keys['ArrowRight']) Body.applyForce(p2, p2.position, { x: m, y: 0 });
                if (keys['ArrowUp'] && Math.abs(p2.velocity.y) < 0.2) Body.applyForce(p2, p2.position, { x: 0, y: -0.1 });

                [p1, p2].forEach(p => { 
                    p.awareness = Math.min(100, p.awareness + 0.005);
                    Body.setAngle(p, p.angle * (0.9 - ((p.awareness / 100) * 0.1)));
                });
            });

            Render.run(render);
            Runner.run(Runner.create(), engine);
        };
    </script>
</body>
</html>
